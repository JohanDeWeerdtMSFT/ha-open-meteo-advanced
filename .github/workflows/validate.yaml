name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Core 2026.10.2 regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements_test.txt
      - name: Verify target version
        run: |
          python -c "from importlib.metadata import version; assert version('homeassistant') == '2026.10.2'; print('Home Assistant', version('homeassistant'))"
      - run: python -m pytest -q
